name: "AppBuilder Install"
description: "Install Appbuilder for Tests"
inputs:
   stack: # id of input
      description: "Docker stack reference"
      required: false
      default: "ab"
   folder: # id of input
      description: "Folder to install in"
      required: false
      default: "AppBuilder"
   port: # id of input
      description: "Port to use for the main stack"
      required: false
      default: "80"
   runtime: # id of input
      description: "Runtime to use for ab_runtime test"
      required: false
      default: null
   ab_cli:
      description: "GitHub repo to install ab-cli from (owner/name)"
      required: false
      default: "CruGlobal-AI/ab-cli"
   repository:
      description: "Repository name, ex CruGlobal-AI/repo"
      default: ${{ github.repository }}

# outputs:
#   time: # output will be available to future steps
#     description: 'The current time after waiting'
runs:
   using: "node24"
   main: "dist/index.js"
